open_risks:
  - "Pushing .github/workflows/ needs workflow permission on the pushing credential."
  - "A repository ruleset covering all branches could block the atlas-ci-proofs push."
  - "workflow_dispatch works only once the workflow file is also on the default branch (main)."
  - "CI runs PostgreSQL 16.15 while the golden results were recorded on 16.13; the canary turns any drift into a visible FAIL."
  - "A candidate that fails QA later and stays in the repo keeps CI red until it is added to the runner's historical list (governed edit)."
  - "by-commit/<sha>.md shows the last published run for a commit; INDEX.tsv keeps all runs."

builder_protocol_for_atl82_candidates: "Replaces 'run the gate locally' in the ATL-83 re-QA handoff. Land the candidate as governance/implementation/ATL_82_CANDIDATE_PHYSICAL_MIGRATION_V<n>_<m>.sql; CI gates it and its proof shows the gate result and the file's blob, but FAIL until pinned. Pin that blob in ATL-82.yaml working_outputs (path + blob_sha); the proof for the pin commit must read 'PASS (1 of 1 candidate(s) passed the gate)' with the reviewed CI code blobs. That proof, cited by path, run URL and source commit, is the builder's executable first-party proof."

