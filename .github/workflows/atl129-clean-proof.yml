name: ATL-129 clean proof and F-130-06 runtime integration
on:
  pull_request:
    paths:
      - 'governance/implementation/atl129_clean/**'
      - 'runtime/rule_ontology_consumer.py'
      - 'runtime/test_rule_ontology_consumer.py'
      - 'governance/product/ATLAS_V2_BUSINESS_RULE_ONTOLOGY_RUNTIME_CONSUMPTION_CONTRACT_V0_1_CANDIDATE.md'
      - '.github/workflows/atl129-clean-proof.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ATL-129 deterministic proof suite
        run: |
          cd governance/implementation/atl129_clean
          python -m unittest -v test_clean_proof.py
      - name: Run F-130-06 production-consumer integration suite
        run: |
          python -m unittest -v runtime/test_rule_ontology_consumer.py
