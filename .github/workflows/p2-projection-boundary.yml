name: P2 Projection Boundary

on:
  push:
    branches:
      - atlas-presentation-architecture-v1-p2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify P2 projection and public IP boundary
        run: npm run p2:check
