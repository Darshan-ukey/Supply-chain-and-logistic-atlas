name: R0.2 Road LTL Source Closure & P6.0 Re-certification

on:
  push:
    branches:
      - atlas-recovery-r0-2-road-ltl-source-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Environment
        run: |
          echo "node: $(node --version)"
          echo "commit: ${GITHUB_SHA}"

      - name: Custodied assets must match their registered hashes
        run: |
          node -e '
            const fs=require("fs"),c=require("crypto");
            const sha=p=>c.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
            const reg=Object.fromEntries(JSON.parse(fs.readFileSync("governance/frozen-assets/ASSET_REGISTER.json","utf8")).assets.map(a=>[a.assetId,a]));
            const checks=[["road-ltl-1.4-candidate","data/modules/road-ltl-v1.4.json"],
                          ["road-ltl-1.5-candidate","data/modules/road-ltl-v1.5.json"],
                          ["road-ltl-1.5-operational","data/operational-knowledge/road-ltl-v1.5-operational.json"],
                          ["road-ltl-1.3","data/modules/road-ltl-v1.3.json"]];
            for(const [id,p] of checks){
              if(sha(p)!==reg[id].sha256)throw new Error("hash mismatch for "+id+" at "+p);
              console.log("verified: "+id+" "+reg[id].sha256);
            }
          '

      - name: Assert governed inputs were not mutated
        run: |
          git fetch origin atlas-governance-registry-v2.1 --depth=1
          for f in governance/frozen-assets/ASSET_REGISTER.json \
                   governance/recovery/R0.1C/REFERENCE_OWNERSHIP_DETERMINATION.json \
                   governance/recovery/R0.1C/POST_QA_GOVERNED_STATE.json \
                   data/crosswalks/process-concept-crosswalk-v1.json \
                   data/modules/road-ltl-v1.5.json \
                   data/operational-knowledge/road-ltl-v1.5-operational.json ; do
            if ! git diff --quiet origin/atlas-governance-registry-v2.1 -- "$f"; then
              echo "R0.2 must not mutate governed input: $f"; exit 1;
            fi
            echo "unchanged: $f"
          done

      - name: Verify and publish the exact original frozen release ZIP
        run: |
          PKG=release/packages/frozen/atlas-daughter-release-ltl-v1.4-ocean-v0.6.zip
          CANON=b81b22d2a31869441ccfbbee05a24f6ac296d32fd56ce4c46472cac7894eb289
          ACTUAL=$(sha256sum "$PKG" | cut -d' ' -f1)
          echo "custodied package sha256 : $ACTUAL"
          echo "canonical registered     : $CANON"
          [ "$ACTUAL" = "$CANON" ] || { echo "original package bytes do not match the canonical SHA"; exit 1; }
          # the archive must be the original, not a re-compression of extracted files
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile("release/packages/frozen/atlas-daughter-release-ltl-v1.4-ocean-v0.6.zip")
          names=z.namelist()
          assert len(names)==31, f"unexpected entry count {len(names)}"
          assert all(n.startswith("atlas-daughter-release-ltl-v1.4-ocean-v0.6/") for n in names), "unexpected archive root"
          print(f"archive verified: {len(names)} entries, original release root preserved")
          PY
          # every one of the 30 manifest entries must still verify from inside the original ZIP
          python3 - <<'PY'
          import zipfile,json,hashlib
          z=zipfile.ZipFile("release/packages/frozen/atlas-daughter-release-ltl-v1.4-ocean-v0.6.zip")
          root="atlas-daughter-release-ltl-v1.4-ocean-v0.6/"
          man=json.loads(z.read(root+"validation/SHA256SUMS.json"))
          ok=0
          for rel,h in man.items():
              if hashlib.sha256(z.read(root+rel)).hexdigest()!=h:
                  raise SystemExit(f"manifest mismatch inside original ZIP: {rel}")
              ok+=1
          print(f"internal manifest verified from the original ZIP: {ok}/{len(man)}")
          PY

      - name: Publish original frozen release ZIP as custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: r0-2-frozen-release-package-b81b22d2
          path: release/packages/frozen/atlas-daughter-release-ltl-v1.4-ocean-v0.6.zip
          if-no-files-found: error
          retention-days: 90

      - name: R0.2 source closure certification
        run: node tests/r0-2-road-ltl-source-closure.mjs

      - name: P6.0 re-certification from retained inputs and tooling
        run: node tests/p6-0-road-ltl-1.5-effective-materialization.mjs

      - name: R0.1C ownership model regression (re-derived, not the superseded test)
        run: |
          node tools/references/audit-reference-ownership.mjs --out /tmp/audit.json
          node -e '
            const a=require("/tmp/audit.json");
            const by=c=>a.classes.find(x=>x.identifierClass===c);
            if(JSON.stringify(Object.keys(by("a5").byLayer))!==JSON.stringify(["DAUGHTER_LOCAL"]))throw new Error("a5 ownership drifted");
            if(JSON.stringify(Object.keys(by("scp").byLayer))!==JSON.stringify(["CROSS_LAYER_CONTRACT"]))throw new Error("scp ownership drifted");
            const orphans=a.classes.flatMap(c=>c.identifiers).filter(i=>i.governingLayer==="ORPHAN").length;
            if(orphans)throw new Error("orphans appeared: "+orphans);
            console.log("R0.1C ownership model holds: a5="+by("a5").referencedCount+" scp="+by("scp").referencedCount+" orphans=0");
          '
          # tests/r0-1c-reference-ownership.mjs is retained byte-identical but one assertion
          # (its own Checkpoint C must not exist) is superseded now that QA has created it.

      - name: Reproduce effective 1.5 materialization and assert byte equality
        run: |
          node tools/road-ltl/materialize-effective-road-ltl.mjs --out /tmp/eff.json
          diff -q /tmp/eff.json data/road-ltl/effective-road-ltl-1.5-materialization.json \
            || { echo "effective materialization is not reproducible"; exit 1; }
          node -e '
            const m=require("./data/road-ltl/effective-road-ltl-1.5-materialization.json");
            const l=m.lineage;
            if(l.inheritedUnchangedCount!==21)throw new Error("expected 21 inherited, got "+l.inheritedUnchangedCount);
            if(l.directGovernedOverrideCount!==1)throw new Error("expected 1 override");
            if(JSON.stringify(l.overriddenTaskIds)!==JSON.stringify(["LTL-03"]))throw new Error("override must be LTL-03");
            console.log("lineage proven: 21 x 1.4 + LTL-03 x 1.5");
          '

      - name: Assert no promotion and Ocean custody deferred
        run: |
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("governance/recovery/R0.2/ROAD_LTL_SOURCE_CLOSURE_RECORD.json","utf8"));
            for(const k of ["canonicalPromotion","currentPointer","latestPointer","assetRegister"]){
              if(!["NOT_PERFORMED","UNCHANGED"].includes(c.promotion[k]))throw new Error("premature promotion: "+k+"="+c.promotion[k]); }
            if(c.promotion.assetRegisterBindsRecoveredRepositoryPaths!==false)throw new Error("record must not imply register binding");
            if(c.B_custodyClosure.registerTreatment.registerMutatedByThisStage)throw new Error("register must not be mutated");
            if(fs.existsSync("data/modules/ocean-fcl-v0.6.json"))throw new Error("Ocean custody is R0.5 scope");
            const b=JSON.parse(fs.readFileSync("governance/recovery/R0.2/POST_IMPLEMENTATION_PRE_QA.json","utf8"));
            if(b.nextAuthorization!=="AWAITING_INDEPENDENT_QA")throw new Error("stage must stop at AWAITING_INDEPENDENT_QA");
            if(b.qaDisposition!==null)throw new Error("implementation agent must not set qaDisposition");
            if(fs.existsSync("governance/recovery/R0.2/POST_QA_GOVERNED_STATE.json"))throw new Error("Checkpoint C is not written by the implementation agent");
            console.log("scope and stop condition verified");
          '
          for f in governance/frozen-assets/CURRENT.json governance/frozen-assets/LATEST.md; do
            if ! git diff --quiet origin/atlas-governance-registry-v2.1 -- "$f"; then
              echo "R0.2 must not modify $f"; exit 1;
            fi
            echo "unchanged: $f"
          done
