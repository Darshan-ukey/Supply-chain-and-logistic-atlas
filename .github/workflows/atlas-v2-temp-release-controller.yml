name: Atlas v2 Temporary Release Controller

on:
  workflow_dispatch:
  push:
    branches:
      - atlas-v2-temp-release-controller
    paths:
      - "tools/atlas-release-controller/**"
      - "governance/product/ATLAS_V2_PRODUCT_END_STATE_CONTRACT_V1_CANDIDATE.md"
      - "governance/product/ATLAS_V2_PRODUCT_COVERAGE_MATRIX_V1_CANDIDATE.json"
      - "governance/task-manifests/**"
      - ".github/workflows/atlas-v2-temp-release-controller.yml"

concurrency:
  group: atlas-v2-temp-release-controller
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Controller unit tests
        run: node tools/atlas-release-controller/tests/controller.test.mjs

      - name: Release controller preflight
        run: node tools/atlas-release-controller/controller.mjs --mode=preflight

      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Stable repository baseline
        run: |
          node tests/v1.1.7-canonical-integrity.mjs
          node tests/v2-universal-ask-smoke.mjs
          node tests/v2-public-ip-boundary.mjs
          node tests/v2-admin-auth-smoke.mjs
          node tests/v2-api-router-smoke.mjs
          node tests/v2.1-execution-fabric-smoke.mjs

      - name: Browser environment probe
        id: browser_probe
        continue-on-error: true
        run: node tests/v2-ui-browser-smoke.mjs

      - name: Record browser probe disposition
        if: always()
        run: |
          mkdir -p artifacts/atlas-v2-release-controller
          printf '%s\n' '{"validator":"v2-ui-browser-smoke","phase":"PRE_FREEZE","required_for_product_live":true,"pre_freeze_blocking":false,"result":"${{ steps.browser_probe.outcome }}","note":"A failure here is not converted to PASS. Browser/deployed validation remains mandatory for UI tasks and ATL-109."}' > artifacts/atlas-v2-release-controller/browser-probe.json

      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v2-release-controller-report
          path: artifacts/atlas-v2-release-controller/
          if-no-files-found: error
