name: Frozen Asset Registry

on:
  pull_request:
    paths:
      - 'governance/frozen-assets/**'
      - 'governance/standards/**'
      - 'scripts/frozen-assets-registry.mjs'
  push:
    paths:
      - 'governance/frozen-assets/**'
      - 'governance/standards/**'
      - 'scripts/frozen-assets-registry.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/frozen-assets-registry.mjs validate
