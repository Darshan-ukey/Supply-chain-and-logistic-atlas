name: Atlas P6.2 Compile Dispatcher

# ---------------------------------------------------------------------------
# Default-branch bootstrap plumbing ONLY.
#
# GitHub only exposes a workflow_dispatch workflow in the Actions UI and API if
# the workflow file exists on the repository default branch. The P6.2 compile
# workflow lives on the P6.2 implementation branch, so it can never appear.
#
# This dispatcher exists on the default branch purely to provide the manual
# trigger. It contains NO P6.2 application, compiler, schema or governance
# implementation. It checks out the requested ref and runs the implementation
# from there, so P6.2 is never imported into the default branch.
#
# Required repository secrets (never printed):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Governed P6.2 implementation ref to execute'
        required: true
        default: 'atlas-presentation-architecture-v1-p6-2'
      moduleId:
        description: 'Daughter module id (exact)'
        required: true
        default: 'road-ltl'
      moduleVersion:
        description: 'Effective module version (exact; no fallback permitted)'
        required: true
        default: '1.5'
      expectedDecompositionHash:
        description: 'Pinned certified P6.1 decomposition content hash'
        required: true
        default: '2c26e760ff6a5b3d4a0500d22f79b531a92fb8380d5b31d2a60b8b49506092ab'
      persist:
        description: 'Write the protected WorkDefinition package (explicit opt-in)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested P6.2 implementation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Confirm the ref carries the P6.2 implementation
        run: |
          for f in \
            scripts/compile-p6-2-work-definitions.mjs \
            lib/compile/workdefinition-compiler.js \
            lib/compile/workdefinition-verifier.js \
            lib/compile/p6-1-certification-gate.js \
            governance/baselines/P6_1_RECURSIVE_WORK_DECOMPOSITION_CERTIFICATION.json \
            governance/presentation/P6_1_PUBLIC_DECOMPOSITION_SUMMARY.json ; do
            [ -f "$f" ] || { echo "Ref '${{ inputs.ref }}' is missing $f"; exit 1; }
          done
          echo "P6.2 implementation present on ${{ inputs.ref }}"

      - name: Certify compiler, verifier and certification gate
        run: |
          node tests/p6-2-certification-gate.mjs
          node tests/p6-2-canonical-workdefinition-compiler.mjs
          node tests/p6-2-protected-workdefinition-api.mjs

      - name: Dry-run compile with mandatory certification gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATLAS_EXPECTED_DECOMPOSITION_HASH: ${{ inputs.expectedDecompositionHash }}
        run: |
          node scripts/compile-p6-2-work-definitions.mjs \
            "${{ inputs.moduleId }}" "${{ inputs.moduleVersion }}" \
            --out "P6_2_PUBLIC_WORKDEFINITION_SUMMARY.json"

      - name: Assert the summary is PUBLIC_SAFE and non-reconstructive
        run: |
          node -e '
            const s=JSON.parse(require("fs").readFileSync("P6_2_PUBLIC_WORKDEFINITION_SUMMARY.json","utf8"));
            if(s.classification!=="PUBLIC_SAFE_SUMMARY_ONLY")throw new Error("summary is not PUBLIC_SAFE");
            if(s.detailIncluded!==false)throw new Error("summary must not include detail");
            const text=JSON.stringify(s);
            for(const t of ["workDefinitionId","definitions","sourceRefs","requiredClientBindings","requiredKnowledgeGaps","workUnitId","notCompiled\":["]){
              if(text.includes(t))throw new Error("summary leaked protected token: "+t);
            }
            console.log("PUBLIC_SAFE summary verified:",JSON.stringify(s.totals));
          '

      - name: Upload PUBLIC_SAFE summary
        uses: actions/upload-artifact@v4
        with:
          name: p6-2-public-workdefinition-summary
          path: P6_2_PUBLIC_WORKDEFINITION_SUMMARY.json

      - name: Persist protected WorkDefinition package (explicit opt-in only)
        if: ${{ inputs.persist }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATLAS_EXPECTED_DECOMPOSITION_HASH: ${{ inputs.expectedDecompositionHash }}
        run: |
          node scripts/compile-p6-2-work-definitions.mjs \
            "${{ inputs.moduleId }}" "${{ inputs.moduleVersion }}" --persist

      - name: Confirm no protected payload entered the workspace bundle
        run: |
          if grep -rlE '"schemaVersion"[[:space:]]*:[[:space:]]*"atlas-canonical-workdefinition-(v1|package-v1)"' \
              --include='*.json' . | grep -v '^./schemas/'; then
            echo "Protected WorkDefinition payload present in workspace"; exit 1;
          fi
          echo "No protected WorkDefinition payload in the repository bundle."
