name: S8 2A ATL171 Verification
on:
  pull_request:
    paths:
      - 'scripts/materialize-operational-semantics-v1.cjs'
      - 'tests/s8-2a-atl171-operational-semantics.test.cjs'
      - '.github/workflows/s8-2a-atl171-verification.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Execute S8-2A deterministic regression
        run: node tests/s8-2a-atl171-operational-semantics.test.cjs
