name: P6.1 Recursive Work Decomposition

on:
  push:
    branches:
      - atlas-presentation-architecture-v1-p6-1
    paths:
      - 'lib/api/work-decomposition.js'
      - 'scripts/seed-p6-1-work-decompositions.mjs'
      - 'tests/p6-1-protected-work-decomposition-api.mjs'
      - 'tests/p6-0-road-ltl-1.5-effective-materialization.mjs'
      - 'tests/p5-ask-trace-governance.mjs'
      - 'tests/p4-canvas-daughter-integration.mjs'
      - 'tests/p3o-ocean-0.6-certification.mjs'
      - 'tests/p3-universal-daughter-renderer.mjs'
      - 'tests/p2-projection-boundary.mjs'
      - 'tests/v2-public-ip-boundary.mjs'
      - '.github/workflows/p6-1-recursive-work-decomposition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Certify P6.1 protected exact-task resolver
        run: node tests/p6-1-protected-work-decomposition-api.mjs
      - name: Run inherited P6.0 Road LTL 1.5 materialization regression
        run: node tests/p6-0-road-ltl-1.5-effective-materialization.mjs
      - name: Run inherited P5 Ask/Trace/Governance regression
        run: node tests/p5-ask-trace-governance.mjs
      - name: Run inherited P4 Canvas integration regression
        run: node tests/p4-canvas-daughter-integration.mjs
      - name: Run inherited P3O Ocean 0.6 certification
        run: node tests/p3o-ocean-0.6-certification.mjs
      - name: Run inherited P3 Universal Daughter Renderer regression
        run: node tests/p3-universal-daughter-renderer.mjs
      - name: Run inherited P2 projection-boundary regression
        run: node tests/p2-projection-boundary.mjs
      - name: Run inherited public execution-IP boundary regression
        run: node tests/v2-public-ip-boundary.mjs
