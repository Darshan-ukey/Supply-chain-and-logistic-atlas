name: P3O Ocean 0.6 Certification

on:
  push:
    branches:
      - atlas-presentation-architecture-v1-p3o
    paths:
      - 'data/materialized/ocean-0.6-public-safe-projections.json.gz.b64'
      - 'governance/baselines/P3O_OCEAN_0_6_SOURCE_CERTIFICATION.json'
      - 'governance/presentation/p2-projection-source-registry.json'
      - 'lib/projections/execution-depth-projection.js'
      - 'assets/universal-daughter-renderer-v2.js'
      - 'tests/p3o-ocean-0.6-certification.mjs'
      - 'package.json'
      - '.github/workflows/p3o-ocean-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run P3O Ocean certification and inherited security regressions
        run: npm run p3o:check
