name: P3O Ocean 0.6 Certification

on:
  push:
    branches:
      - atlas-presentation-architecture-v1-p3o
    paths:
      - 'data/materialized/ocean-0.6-canonical-payloads.tar.gz.b64'
      - 'data/materialized/ocean-0.6-canonical-payloads.parts/*.b64'
      - 'data/modules/ocean-*-v0.6.json'
      - 'data/operational-knowledge/ocean-*-v0.6-operational.json'
      - 'data/client-binding-requirements/ocean-*-v0.6-bindings.json'
      - 'data/source-claims/ocean-*-v0.6-claims.json'
      - 'data/exchanges/ocean-*-v0.6-system-exchanges.json'
      - 'governance/presentation/p2-projection-source-registry.json'
      - 'lib/projections/execution-depth-projection.js'
      - 'tests/p3o-ocean-0.6-certification.mjs'
      - 'package.json'
      - '.github/workflows/p3o-ocean-certification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expand exact frozen Ocean 0.6 payload carrier
        shell: bash
        run: |
          set -euo pipefail
          PARTS='data/materialized/ocean-0.6-canonical-payloads.parts/part-*.b64'
          if compgen -G "$PARTS" > /dev/null; then
            cat data/materialized/ocean-0.6-canonical-payloads.parts/part-*.b64 | tr -d '\r\n' > /tmp/ocean-0.6-canonical-payloads.b64
          else
            tr -d '\r\n' < data/materialized/ocean-0.6-canonical-payloads.tar.gz.b64 > /tmp/ocean-0.6-canonical-payloads.b64
          fi
          base64 --decode /tmp/ocean-0.6-canonical-payloads.b64 > /tmp/ocean-0.6-canonical-payloads.tar.gz
          echo '0cca7c23fdd36b397653b198b85552ad96678636fad5015d76522322a636e17d  /tmp/ocean-0.6-canonical-payloads.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ocean-0.6-canonical-payloads.tar.gz
      - name: Verify all frozen canonical SHA-256 values
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' >/tmp/ocean-sha256.txt
          334d6a11595d33c46fa3b4675aa953f1fa6943906894f1cad7a8caf30cad034a  data/modules/ocean-fcl-v0.6.json
          73d416683f43357cd0eabfe96009405fa22d74008e452f977fa489f0c395850f  data/modules/ocean-lcl-v0.6.json
          c665f946fa30ccea081fa6a8ad3129e7217cfdff1d20ea7ee15e4ac70506aae3  data/operational-knowledge/ocean-fcl-v0.6-operational.json
          3ba54c522a28e8e05f1f65e418eb450ba46c701de0a0d353234d467c9033307e  data/operational-knowledge/ocean-lcl-v0.6-operational.json
          9a86fe6c26360993673fc899ac8529103704a55a1a7f3d7b8455123e4261a005  data/client-binding-requirements/ocean-fcl-v0.6-bindings.json
          47633373b70ac43fc02e271eb22b4a2b678107160f17385faf277b9e5a903a46  data/client-binding-requirements/ocean-lcl-v0.6-bindings.json
          99cd023485c0e632d387defcd8419d64ad1e68b58a0136db535721421946d1ef  data/source-claims/ocean-fcl-v0.6-claims.json
          4d06be7436755ebddfc66ff74da2fe67583bd104def6b6c598a0e77a3d31fd21  data/source-claims/ocean-lcl-v0.6-claims.json
          e0e19d7f7e81d5a44f2e7b03669e150c86ca74f8e22f37b61355efb0490cc346  data/exchanges/ocean-fcl-v0.6-system-exchanges.json
          5df868d6714454e239186d6097d39e261219858fc39b38d345f5b68a440a0828  data/exchanges/ocean-lcl-v0.6-system-exchanges.json
          EOF
          sha256sum -c /tmp/ocean-sha256.txt
      - name: Run P3O certification and inherited security regressions
        run: npm run p3o:check
      - name: Persist exact canonical materialization on P3O branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'atlas-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/modules/ocean-fcl-v0.6.json data/modules/ocean-lcl-v0.6.json \
            data/operational-knowledge/ocean-fcl-v0.6-operational.json data/operational-knowledge/ocean-lcl-v0.6-operational.json \
            data/client-binding-requirements/ocean-fcl-v0.6-bindings.json data/client-binding-requirements/ocean-lcl-v0.6-bindings.json \
            data/source-claims/ocean-fcl-v0.6-claims.json data/source-claims/ocean-lcl-v0.6-claims.json \
            data/exchanges/ocean-fcl-v0.6-system-exchanges.json data/exchanges/ocean-lcl-v0.6-system-exchanges.json
          if ! git diff --cached --quiet; then
            git commit -m 'P3O: materialize exact frozen Ocean 0.6 canonical payloads'
            git push origin HEAD:atlas-presentation-architecture-v1-p3o
          fi
