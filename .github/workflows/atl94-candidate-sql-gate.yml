name: ATL-94 Candidate SQL Gate

# GitHub executes the ATL-82 candidate SQL so that no agent has to (ATL-94).
# - gate: starts a disposable PostgreSQL 16 on the runner (Unix socket only, no network listener, no secrets,
#   never Supabase), proves the environment with a canary, and runs the ATL-83 corrected-candidate gate against
#   every conventionally named ATL-82 candidate other than the failed historical V0.1/V0.2. ATL-82 SQL files that
#   break the naming convention, and pinned .sql paths with no such candidate, fail the run (see the runner
#   header for the full rules: naming, history, pins in governance/task-manifests/ATL-82.yaml).
# - publish-proof: records the result on the atlas-ci-proofs branch, keyed by commit, so ChatGPT, Claude and
#   the Owner can all read it as a plain file. It is the only job with write permission, and it writes only
#   to atlas-ci-proofs.

on:
  push:
    branches: ['**']
    paths:
      - 'governance/implementation/ATL_82_CANDIDATE_PHYSICAL_MIGRATION_*.sql'
      - '**/*ATL_82_CANDIDATE*'
      - '**/*atl_82_candidate*'
      - '**/*ATL_82*.sql'
      - '**/*atl_82*.sql'
      - '**/*ATL-82*.sql'
      - '**/*ATL_82*/**'
      - '**/*atl_82*/**'
      - 'governance/task-manifests/ATL-82.yaml'
      - 'governance/implementation/ATL_83_CORRECTED_CANDIDATE_GATE_V0_1.sh'
      - 'governance/implementation/ATL_83_EXECUTABLE_TEST_PACK_V0_2.sh'
      - 'governance/implementation/ATL_83_TEST_PACK_OUTPUT_V0_2.txt'
      - 'governance/implementation/ATL_94_CI_*.sh'
      - '.github/workflows/atl94-candidate-sql-gate.yml'
  pull_request:
    paths:
      - 'governance/implementation/ATL_82_CANDIDATE_PHYSICAL_MIGRATION_*.sql'
      - '**/*ATL_82_CANDIDATE*'
      - '**/*atl_82_candidate*'
      - '**/*ATL_82*.sql'
      - '**/*atl_82*.sql'
      - '**/*ATL-82*.sql'
      - '**/*ATL_82*/**'
      - '**/*atl_82*/**'
      - 'governance/task-manifests/ATL-82.yaml'
      - 'governance/implementation/ATL_83_CORRECTED_CANDIDATE_GATE_V0_1.sh'
      - 'governance/implementation/ATL_83_EXECUTABLE_TEST_PACK_V0_2.sh'
      - 'governance/implementation/ATL_83_TEST_PACK_OUTPUT_V0_2.txt'
      - 'governance/implementation/ATL_94_CI_*.sh'
      - '.github/workflows/atl94-candidate-sql-gate.yml'
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    name: Execute ATL-82 candidate SQL in a disposable PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ATL83_DISPOSABLE: '1'
      PGPORT: '55433'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Start a disposable PostgreSQL 16 (Unix socket only)
        run: |
          set -euo pipefail
          PGBIN=/usr/lib/postgresql/16/bin
          if [ ! -x "$PGBIN/initdb" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-16
          fi
          SOCK="$RUNNER_TEMP/atl94-pgsock"
          DATA="$RUNNER_TEMP/atl94-pgdata"
          mkdir -p "$SOCK"
          "$PGBIN/initdb" -D "$DATA" -U postgres --auth=trust --locale=C.UTF-8 --encoding=UTF8 > /dev/null
          "$PGBIN/pg_ctl" -D "$DATA" -o "-k $SOCK -p $PGPORT -c listen_addresses=''" -l "$RUNNER_TEMP/atl94-pg.log" -w start
          echo "PGHOST=$SOCK" >> "$GITHUB_ENV"

      - name: Ensure PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user --break-system-packages pyyaml

      - name: Run the ATL-83 gate against every ATL-82 candidate (with canary)
        env:
          ATL94_OUT_DIR: ${{ runner.temp }}/atl94-result
        run: bash governance/implementation/ATL_94_CI_CANDIDATE_GATE_RUNNER_V0_1.sh

      - name: Upload the gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atl94-gate-result
          path: ${{ runner.temp }}/atl94-result
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  publish-proof:
    name: Publish the result to atlas-ci-proofs
    needs: gate
    # Runs even when the gate job failed, timed out or was cancelled; the publisher records anything but success as FAIL.
    if: ${{ always() && github.event_name != 'pull_request' && needs.gate.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the gate result
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: atl94-gate-result
          path: ${{ runner.temp }}/atl94-result

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATL94_RESULT_DIR: ${{ runner.temp }}/atl94-result
          ATL94_GATE_JOB_RESULT: ${{ needs.gate.result }}
        run: bash governance/implementation/ATL_94_CI_PROOF_PUBLISHER_V0_1.sh
