name: Schemathesis Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemathesis-smoke:
    name: Real Schemathesis Adapter Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Schemathesis
        run: python -m pip install schemathesis

      - name: Build
        run: npm run build

      - name: Run Schemathesis adapter smoke
        run: npm run smoke:schemathesis

      - name: Upload Schemathesis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brisk-aitesting-schemathesis-artifacts
          path: |
            .brisk-aitesting-reference-serious-saas/**
          if-no-files-found: ignore
          retention-days: 7
