name: brisk-aitesting

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ai-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - name: Run brisk-aitesting
        env:
          APP_BASE_URL: http://127.0.0.1:3000
          AI_ENDPOINT: ${{ secrets.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          npx brisk-aitesting doctor --config brisk-aitesting.config.mjs
          npx brisk-aitesting run --config brisk-aitesting.config.mjs --goal "Check the release-critical UI, API, and contract paths" --scenarios 8 --json
