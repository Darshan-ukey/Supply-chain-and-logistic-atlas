[project]
name = "malkom-langgraph"
version = "0.1.0"
description = "The Python side of the Malkom agent engine's LangGraph adapter."
requires-python = ">=3.10"
dependencies = ["langgraph>=0.2", "langchain-core>=0.3"]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["malkom_langgraph"]
