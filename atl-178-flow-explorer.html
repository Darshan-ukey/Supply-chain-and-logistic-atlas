<!doctype html>
<html><head><meta charset="utf-8"><title>Atlas v1.5 LTL-04 Flow Explorer</title>
<style>body{font:14px system-ui;background:#f4f7f8;color:#153241;margin:0}header{background:#071a2a;color:#fff;padding:16px}main{padding:20px}.controls button{margin:0 6px 12px 0;padding:8px}.card{background:#fff;border:1px solid #dbe3e7;border-radius:10px;padding:16px}svg{width:100%;height:460px}.node{fill:#fff;stroke:#0c9fc0;stroke-width:2}.edge{stroke:#73858e;stroke-width:2}.trace{stroke:#ef8b17;stroke-width:6}.bpmn .node{stroke:#7450d8}.meta{font-size:12px}</style></head>
<body><header><b>Malkom Domain Warehouse · Road LTL / LTL-04 · Generated Queue Flow Explorer</b></header><main>
<div class="controls"><button id="flowView">Flow view</button><button id="bpmnView">BPMN view</button><button id="traceBtn">Trace selected work item</button><button id="exportImage">Export current diagram as image (SVG)</button><a href="data/generated/flow-graphs/road-ltl-ltl04-v1.bpmn" download>Export BPMN 2.0</a></div>
<div class="card"><p id="lineage" class="meta"></p><p id="unsupported" class="meta"></p><svg id="diagram" viewBox="0 0 1000 460" aria-label="Generated queue flow"></svg></div>
<script>
const SOURCE='data/generated/flow-graphs/road-ltl-ltl04-v1.json';let graph,mode='flow',trace=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function layout(g){const ends=g.nodes.filter(n=>n.type==='END');const pos={};g.nodes.forEach(n=>{if(n.type==='START')pos[n.id]=[80,230];else if(n.type==='TASK')pos[n.id]=[270,230];else if(n.type==='GATEWAY')pos[n.id]=[500,230]});ends.forEach((n,i)=>pos[n.id]=[800,65+i*105]);return pos}
function render(){const s=document.getElementById('diagram'),p=layout(graph),selected=new Set(graph.trace.selectedPath);s.classList.toggle('bpmn',mode==='bpmn');let out='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z"/></marker></defs>';
for(const e of graph.edges){const a=p[e.from],b=p[e.to],hit=trace&&selected.has(e.from)&&selected.has(e.to);out+=`<line class="edge ${hit?'trace':''}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" marker-end="url(#arrow)"/>`}
for(const n of graph.nodes){const q=p[n.id],shape=mode==='bpmn'&&n.type==='GATEWAY'? `<polygon class="node" points="${q[0]},${q[1]-38} ${q[0]+38},${q[1]} ${q[0]},${q[1]+38} ${q[0]-38},${q[1]}"/>`:n.type==='TASK'?`<rect class="node" x="${q[0]-90}" y="${q[1]-38}" width="180" height="76" rx="8"/>`:`<circle class="node" cx="${q[0]}" cy="${q[1]}" r="32"/>`;out+=shape+`<text x="${q[0]}" y="${q[1]+4}" text-anchor="middle" font-size="12">${esc(n.label)}</text>`}
s.innerHTML=out}
function exportSvg(){const clone=document.getElementById('diagram').cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=graph.graphId.replace(/[:]/g,'-')+'-'+mode+'.svg';a.click();URL.revokeObjectURL(a.href)}
fetch(SOURCE).then(r=>{if(!r.ok)throw Error('flow graph unavailable');return r.json()}).then(g=>{graph=g;lineage.textContent=`${g.graphId} · ${g.scope.workDefinitionId} · ${g.scope.malkomPackageId} · canonicalMutation=${g.lineage.canonicalMutation}`;unsupported.textContent='Unsupported surfaced, not invented: '+g.unsupported.map(x=>x.semantic+'='+x.state).join('; ');render()}).catch(e=>{document.querySelector('.card').textContent='Fail closed: '+e.message});
flowView.onclick=()=>{mode='flow';render()};bpmnView.onclick=()=>{mode='bpmn';render()};traceBtn.onclick=()=>{trace=!trace;render()};exportImage.onclick=exportSvg;
</script></body></html>
