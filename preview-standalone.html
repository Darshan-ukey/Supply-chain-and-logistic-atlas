<body>
<div id="app" class="app" data-view="explore">
  <header class="topbar">
    <button class="brand" id="fitUniverse" aria-label="Fit Universe">
      <span class="brand-mark">OI</span>
      <span><b>Operations Intelligence</b><small>Pilot V1.0 · Atlas V6.2.3</small></span>
    </button>
    <nav class="primary" aria-label="Primary">
      <button data-view="explore" class="active">Explore</button>
      <button data-view="execute">Execute</button>
      <button data-view="compare">Compare</button>
      <button data-view="transform">Transform</button>
    </nav>
    <div class="top-actions">
      <button class="chip" id="coverageBtn"><span id="coverageStatus">Road LTL · A5</span></button>
      <button class="chip" id="workspaceBtn">Local Pilot</button>
      <button class="ask-main" id="askBtn">Ask Atlas</button>
    </div>
  </header>

  <div class="context-ribbon" id="contextRibbon">
    <span class="context-title">Active Context</span>
    <button data-open="context" class="context-pill">Road · LTL</button>
    <span id="contextChips"></span>
    <button class="ghost small" id="resetContext">Reset</button>
  </div>

  <main class="shell">
    <aside class="left-rail" id="leftRail">
      <div class="rail-head"><b>Context</b><button class="icon" id="collapseRail" aria-label="Collapse context">‹</button></div>
      <section class="rail-section">
        <label>Mode / Service
          <select id="moduleSelect"><option value="road-ltl">Road LTL · A5 verified</option><option disabled>Road FTL · reference only</option><option disabled>Ocean FCL · planned</option><option disabled>Ocean LCL · planned</option><option disabled>Air Cargo · planned</option></select>
        </label>
        <label>Role<select id="roleSelect"></select></label>
        <label>Movement<select id="movementSelect"></select></label>
        <label>Node<select id="nodeSelect"></select></label>
        <label>Jurisdiction<select id="jurisdictionSelect"></select></label>
        <label>Condition<select id="conditionSelect"></select></label>
        <button class="primary-btn" id="applyContext">Apply & collapse context</button>
      </section>
      <section class="rail-section">
        <div class="eyebrow">Semantic depth</div>
        <div class="segmented" id="depthButtons"><button data-depth="universe" class="active">Universe</button><button data-depth="a3">A3</button><button data-depth="a4">A4</button><button data-depth="a5">A5</button></div>
      </section>
      <section class="rail-section">
        <div class="eyebrow">Lens</div>
        <div class="lens-grid" id="lensButtons"></div>
      </section>
      <section class="rail-section coverage-mini">
        <div class="eyebrow">Coverage</div>
        <b>Road LTL</b><span>A5 VERIFIED</span>
        <div class="bar"><i style="width:100%"></i></div>
        <small>Other modes remain visible as planned/reference knowledge. No LLM backfill.</small>
      </section>
    </aside>

    <section class="workbench">
      <div class="canvas-toolbar">
        <div class="view-title"><span id="viewEyebrow">LEVEL 0 · UNIVERSE</span><b id="viewTitle">Supply Chain Operating Universe</b></div>
        <div class="toolbar-actions">
          <button class="ghost" id="traceBtn">Trace</button>
          <button class="ghost" id="sourceBtn">Sources</button>
          <button class="ghost" id="presentationBtn">Present</button>
          <button class="ghost" id="deliverBtn">Deliver</button>
        </div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <svg class="ambient" id="ambientMesh" viewBox="0 0 1200 720" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="canvas" id="canvas" tabindex="0" aria-label="Supply Chain operational canvas"></div>
        <div class="signal-legend" id="signalLegend"></div>
        <div class="coverage-watermark">V6.2.3 · Road LTL V1.2 · Intelligence v0.6.6 · Stage 23 V1</div>
      </div>

      <div class="playback" id="playbackBar">
        <button class="round" id="prevStep" title="Previous">←</button>
        <button class="round play" id="playPause" title="Play">▶</button>
        <button class="round" id="nextStep" title="Next">→</button>
        <button class="ghost small" id="freezeBtn">Freeze</button>
        <select id="speedSelect" aria-label="Playback speed"><option value="1200">0.5×</option><option selected value="700">1×</option><option value="350">2×</option></select>
        <div class="timeline"><i id="timelineProgress"></i></div>
        <span id="stepCounter">—</span>
        <button class="ghost small" id="exceptionBtn">Inject exception</button>
      </div>
    </section>

    <aside class="inspector" id="inspector">
      <div class="inspector-head"><span class="eyebrow" id="inspectorType">INSPECTOR</span><button class="icon" id="closeInspector" aria-label="Close inspector">×</button></div>
      <div id="inspectorBody" class="inspector-body"></div>
    </aside>
  </main>

  <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-card"><div class="drawer-head"><div><span class="eyebrow" id="drawerEyebrow">WORK SURFACE</span><h2 id="drawerTitle">Panel</h2></div><button class="icon large" id="drawerClose">×</button></div><div id="drawerBody" class="drawer-body"></div></div></div>
  <div class="toast" id="toast"></div>
</div>

function relevanceForProcess(p){
 const apps=p.applicability||{};let score=0,blocked=false,conditional=false;
 const pairs=[['roleApplicability','role'],['movementApplicability','movement'],['nodeApplicability','node'],['jurisdictionApplicability','jurisdiction'],['conditionApplicability','condition'],['contractApplicability','contract']];
 for(const [key,dim] of pairs){const val=state.context[dim];if(!val)continue;const a=apps[key]||{};if((a.incompatible||[]).includes(val))blocked=true;else if((a.required||[]).length&&!(a.required||[]).includes(val))blocked=true;else if((a.primary||[]).includes(val))score+=3;else if((a.applicable||[]).includes(val))score+=2;else if((a.conditional||[]).includes(val)){score+=1;conditional=true}else if((a.notDirect||[]).includes(val))score-=1;}
 return {blocked,conditional,score,state:blocked?'BYPASSED':conditional?'CONDITIONAL':score>=1?'ACTIVE':'ADJACENT'};
}

function findingsFor(p){const a=[];const text=[p.action,p.control,p.evidence,p.decision,p.clock,p.producer,p.consumers].join(' ');if(/inspect|manual|adjudicat|verify|review/i.test(text))a.push(findingObj(p,'HUMAN','Human / inspection dependency','Potential cycle-time or consistency exposure where execution depends on human inspection, adjudication or manual work.','Workflow orchestration · Rules-assisted validation · HITL automation'));if(/reconcil|mismatch|variance|discrep/i.test(text))a.push(findingObj(p,'RECON','Reconciliation dependency','Potential rework or state-consistency exposure where execution depends on reconciliation or discrepancy resolution.','Deterministic validation · Automated reconciliation · Exception workflow'));if((p.documentIds||[]).length||/document|evidence|scan|photo|receipt|POD/i.test(text))a.push(findingObj(p,'EVIDENCE','Evidence / document dependency','Potential handling or validation effort where the task depends on governed document/evidence completeness.','Document intelligence · Evidence capture · Completeness validation'));if(p.clock)a.push(findingObj(p,'TIMING','Time-window dependency','Potential service exposure where execution depends on a validity period, cut-off, response clock or operating window.','Event alerts · Deadline orchestration · Predictive warning'));if(/invoice|rate|charge|settle|payment|billing/i.test([p.label,p.financial].join(' ')))a.push(findingObj(p,'FIN','Financial-state dependency','Potential revenue, cost or settlement exposure where correct execution evidence enables financial state progression.','Rules validation · Event-driven financial trigger · Exception analytics'));return a}

function advanceOpportunity(id){const o=state.client.opportunities.find(x=>x.id===id);if(!o)return;const allowed=['CANDIDATE','PRIORITIZED','SOLUTION_DESIGNED','PARKED','PILOT','IMPLEMENTED','MEASURED'];const next=prompt(`Lifecycle status:\n${allowed.join(' / ')}`,o.status);if(!next||!allowed.includes(next.toUpperCase()))return toast('Invalid lifecycle state');const status=next.toUpperCase();if(['PILOT','IMPLEMENTED','MEASURED'].includes(status)){const owner=prompt('Owner (required)',o.owner||'');const note=prompt('Delivery / validation note (required)',o.deliveryNote||'');if(!owner||!note)return toast('Owner and delivery note required');o.owner=owner;o.deliveryNote=note}if(status==='MEASURED'){const observed=prompt('Observed outcome — evidence-based statement only (required)',o.measuredOutcome||'');const basis=prompt('Measurement basis / evidence (required)',o.measurementBasis||'');if(!observed||!basis)return toast('Measured outcome and basis required');o.measuredOutcome=observed;o.measurementBasis=basis}o.status=status;o.updatedAt=new Date().toISOString();saveClient();renderTxTab('opportunities')}
function designFuture(id){const o=state.client.opportunities.find(x=>x.id===id);if(!o)return;const proposal=prompt('Describe proposed operating change. This remains a TO-BE proposal, not Atlas fact.',state.client.futureStates?.[id]?.proposalSummary||'');if(!proposal)return;const treatment=prompt('Task treatment: RETAIN / ASSIST / AUTOMATE / REMOVE / REDESIGN','ASSIST')||'ASSIST';state.client.futureStates[id]={proposalSummary:proposal,taskTreatment:treatment.toUpperCase(),actorChange:prompt('Actor change (optional)','')||'',systemChange:prompt('System change (optional)','')||'',controlChange:prompt('Control change (optional)','')||'',evidenceChange:prompt('Evidence change (optional)','')||'',status:'PROPOSED',updatedAt:new Date().toISOString()};if(o.status==='CANDIDATE'||o.status==='PRIORITIZED')o.status='SOLUTION_DESIGNED';saveClient();renderTxTab('future')}

function deliver(kind){if(kind==='summary'){const top=deterministicFindings().slice(0,6);$('#drawerBody').innerHTML=`<div class="panel-card"><h3>Executive Summary</h3><p><b>Context:</b> Road LTL · ${esc(labelOf(M.roles,state.context.role))} · ${esc(labelOf(M.movements,state.context.movement))}</p><p>Road LTL is the only A5-verified execution module in this pilot. ${top.length} representative transformation signals are shown below; they remain hypotheses until client evidence validates an issue.</p><ul>${top.map(f=>`<li><b>${esc(f.processId)}</b> — ${esc(f.signal)}</li>`).join('')}</ul><p><b>Governance:</b> Atlas reference, client fact, derived signal and recommendation remain separate evidence classes.</p></div>`;return}if(kind==='collection'){const name=prompt('Collection name','Revenue leakage investigation');if(name){state.client.collections.push({id:'COL-'+Date.now(),name,processIds:state.selected?[state.selected]:[],createdAt:new Date().toISOString()});saveClient();toast('Collection created')}return}if(kind==='markdown')return downloadText('transformation-pack.md',buildMarkdown(),'text/markdown');if(kind==='json')return downloadText('transformation-pack.json',JSON.stringify(buildPack(),null,2),'application/json');if(kind==='office'){fetch('/api/transformation-export',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({format:'pptx',pack:buildPack()})}).then(r=>{if(!r.ok)throw Error();return r.blob()}).then(b=>downloadBlob('transformation-pack.pptx',b)).catch(()=>toast('Deploy API + dependencies to enable Office/PDF exports'))}}

function downloadText(name,text,type){downloadBlob(name,new Blob([text],{type}))}function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}

function openAsk(){const history=state.chat.map(m=>`<div class="ask-msg ${m.role}">${esc(m.text)}${m.evidence?.length?`<div class="evidence">${m.evidence.map(esc).join(' · ')}</div>`:''}</div>`).join('');openDrawer('ASK ATLAS','Grounded natural-language control layer',`<div class="ask-log" id="askLog">${history||'<div class="empty-state">Ask about the current Atlas, selected task or execution state. Try “What happens at the current step?”, “trace POD”, or “show rating and billing”.</div>'}</div><div class="ask-box"><textarea id="askInput" placeholder="Ask Atlas…"></textarea><button id="askSend">Send</button></div><p class="muted">The LLM may explain or propose a command. Deterministic Atlas rules decide what exists, what applies and what the canvas can execute.</p>`);$('#askSend').onclick=sendAsk;$('#askInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAsk()}}}
async function sendAsk(){const input=$('#askInput'),q=input.value.trim();if(!q)return;state.chat.push({role:'user',text:q});input.value='';renderAskLog();const local=interpretCommand(q);if(local.command){executeCommand(local.command);const msg={role:'bot',text:local.answer,evidence:local.evidence};state.chat.push(msg);renderAskLog();return}try{const r=await fetch('/api/ask-atlas',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,context:state.context,selectedProcessId:state.selected,currentStepId:currentProcess()?.id,lens:state.lens})});if(!r.ok)throw Error('offline');const d=await r.json();state.chat.push({role:'bot',text:d.answer||'No grounded answer returned.',evidence:(d.evidence||[]).map(x=>x.id||x)});if(d.command)executeCommand(d.command)}catch(e){const d=localGroundedAnswer(q);state.chat.push({role:'bot',text:d.answer,evidence:d.evidence})}renderAskLog()}
function renderAskLog(){const e=$('#askLog');if(!e)return;e.innerHTML=state.chat.map(m=>`<div class="ask-msg ${m.role}">${esc(m.text)}${m.evidence?.length?`<div class="evidence">${m.evidence.map(esc).join(' · ')}</div>`:''}</div>`).join('');e.scrollTop=e.scrollHeight}
function interpretCommand(q){const t=q.toLowerCase();if(/trace .*pod|follow .*pod/.test(t))return {command:{type:'TRACE_OBJECT',target:'obj-pod'},answer:'Tracing POD through only the governed processes that create or consume it.',evidence:['obj-pod']};if(/trace .*invoice|follow .*invoice/.test(t))return {command:{type:'TRACE_OBJECT',target:'obj-invoice'},answer:'Tracing invoice relationships supported by the active model.',evidence:['obj-invoice']};if(/show .*rating|take me .*rating/.test(t)){const p=(M.processes||[]).find(p=>/rate|rating|charge/i.test(p.label));return {command:{type:'SELECT_PROCESS',processId:p?.id},answer:`Highlighting ${p?.id} — ${p?.label}.`,evidence:p?.sourceIds||[]}}if(/pause|freeze/.test(t))return {command:{type:'PAUSE_PLAYBACK'},answer:'Playback paused. Current execution state is now the active question context.',evidence:[currentProcess()?.id].filter(Boolean)};if(/play|run execution/.test(t))return {command:{type:'START_PLAYBACK'},answer:'Starting deterministic Road LTL standard execution playback.',evidence:activeSpine()};return {}}
function executeCommand(cmd){if(!cmd)return;if(cmd.type==='TRACE_OBJECT'){state.trace=cmd.target;state.depth='a4';renderAll()}if(cmd.type==='SELECT_PROCESS'&&byProcess[cmd.processId]){state.selected=cmd.processId;state.selectedA3=byProcess[cmd.processId].a3ParentId;state.depth='a4';renderAll();openInspector()}if(cmd.type==='PAUSE_PLAYBACK'){state.playing=false;stopTimer();state.frozen=true;renderAll()}if(cmd.type==='START_PLAYBACK'&&!state.playing)togglePlay()}
function localGroundedAnswer(q){const t=q.toLowerCase();if(/current step|happening now|what is happening/.test(t)&&currentProcess()){const p=currentProcess();return {answer:`${p.id} — ${p.label}. Trigger: ${p.trigger} Action: ${p.action} State after: ${p.after}`,evidence:[p.id,...p.sourceIds]}}const terms=t.split(/\W+/).filter(x=>x.length>3),scores=(M.processes||[]).map(p=>({p,s:terms.reduce((n,w)=>n+([p.label,p.trigger,p.decision,p.rule,p.control,p.action,p.evidence,p.outcome].join(' ').toLowerCase().includes(w)?1:0),0)})).sort((a,b)=>b.s-a.s);const hit=scores[0];if(hit?.s){return {answer:`The strongest Atlas match is ${hit.p.id} — ${hit.p.label}. ${hit.p.outcome} ${hit.p.claimBoundary||''}`,evidence:[hit.p.id,...hit.p.sourceIds]}}return {answer:'I could not find enough support in the published Road LTL Atlas for that question. I will not backfill unpublished A5 knowledge from general model knowledge.',evidence:['COVERAGE_GUARDRAIL']}}
function openWorkspace(){openDrawer('PILOT WORKSPACE','Client mapping & governance boundary',`<div class="panel-grid"><div class="panel-card"><h3>Canonical foundation</h3><p>Read-only for Pilot Users. Page 0, Road LTL, ontology, rules and sources require Admin governance to change.</p></div><div class="panel-card"><h3>Session documents</h3><p>Ephemeral analysis: source/chunks are not written into canonical Atlas or reusable retrieval.</p><button class="ghost" id="uploadDoc">Analyze document</button></div><div class="panel-card"><h3>Client mapping</h3><p>${Object.keys(state.client.mappings).length}/22 Road LTL tasks mapped locally.</p><button class="ghost" id="mapSelected">Map selected task</button></div><div class="panel-card"><h3>Foundation proposals</h3><p>User discovery creates proposals only. It never mutates canonical knowledge directly.</p><button class="ghost" id="proposalBtn">Propose change</button></div></div><div class="panel-card"><h3>Privacy</h3><p>Local preview is for synthetic/non-confidential testing. Use the deployed authenticated workspace and approved provider configuration before real client-confidential use.</p></div>`);$('#uploadDoc').onclick=selectDocument;$('#mapSelected').onclick=mapSelected;$('#proposalBtn').onclick=proposeChange}
function selectDocument(){const i=document.createElement('input');i.type='file';i.accept='.txt,.md,.csv,.json,.html,.pdf,.docx,.pptx,.xlsx';i.onchange=async()=>{const f=i.files[0];if(!f)return;toast('Reading document in session…');if(/text|json|csv|html/.test(f.type)||/\.(txt|md|csv|json|html)$/i.test(f.name)){const text=await f.text();showDocumentCandidates(f.name,text)}else{const bytes=new Uint8Array(await f.arrayBuffer()),b64=btoa(String.fromCharCode(...bytes));try{const r=await fetch('/api/session-document-ingest',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.name,type:f.type,contentBase64:b64,moduleId:'road-ltl'})});if(!r.ok)throw Error();const d=await r.json();showCandidateResponse(f.name,d)}catch(e){toast('Binary parsing requires deployed API + dependencies')}}};i.click()}
function showDocumentCandidates(name,text){const lower=text.toLowerCase(),hits=(M.processes||[]).map(p=>{const words=uniq(p.label.toLowerCase().split(/\W+/).filter(w=>w.length>4));const score=words.filter(w=>lower.includes(w)).length;return {p,score}}).filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,8);showCandidateResponse(name,{status:hits.length?'REVIEW':'QUARANTINED',candidateFacts:hits.map(x=>({processId:x.p.id,statement:`Candidate match from ${name}`,confidence:Math.min(.9,.45+x.score*.08),evidenceQuote:'Exact quote extraction requires deployed document intelligence endpoint.'}))})}
function showCandidateResponse(name,d){$('#drawerTitle').textContent='Document Intelligence · '+name;$('#drawerBody').innerHTML=`<div class="panel-card"><h3>${esc(d.status||'REVIEW')}</h3><p>Candidate structure only. Atlas IDs and transitions remain deterministic validation authorities. Unconfirmed candidate content is not promoted into Atlas knowledge.</p></div><div class="source-list">${(d.candidateFacts||d.facts||[]).map(f=>`<div class="source-item"><b>${esc(f.processId||'UNMAPPED')} · ${esc(f.statement||f.factType||'Candidate fact')}</b><small>Confidence ${esc(Math.round((f.confidence||0)*100))}%</small><p>${esc(f.evidenceQuote||'')}</p></div>`).join('')||'<div class="empty-state">No safe candidate mapping produced.</div>'}</div>`}
function mapSelected(){const p=byProcess[state.selected];if(!p)return toast('Select an A5 task first');const status=prompt('Client alignment: MATCHES / DEVIATES / MAPPED','MAPPED');if(!status)return;const label=prompt('Client activity name (optional)',p.label)||p.label;state.client.mappings[p.id]={status:'MAPPED',alignment:status.toUpperCase(),clientLabel:label,confirmedAt:new Date().toISOString(),evidenceClass:'CLIENT_CONFIRMED'};saveClient();closeDrawer();renderAll();toast('Client fact mapped separately from Atlas reference')}
function proposeChange(){const p=byProcess[state.selected];const text=prompt('Describe proposed foundation change');if(!text)return;const proposal={processId:p?.id||null,proposal:text,status:'PENDING_ADMIN_APPROVAL',createdAt:new Date().toISOString()};state.client.comments.push(proposal);saveClient();toast('Proposal created · canonical foundation unchanged')}
function openCoverage(){openDrawer('ATLAS HEALTH','Coverage & release integrity',`<div class="panel-grid"><div class="panel-card"><h3>Atlas V6.2.3</h3><p>Product/release lineage. Frozen Page 0 remains V6.2.2 internally.</p></div><div class="panel-card"><h3>Road LTL V1.2</h3><p>22 A5 tasks · 13 A3 areas · 39 flow edges · 29 sources.</p></div><div class="panel-card"><h3>Intelligence v0.6.6</h3><p>Work/Learn density, deterministic Simulation Studio and grounded chat guardrails preserved in the cumulative platform.</p></div><div class="panel-card"><h3>Stage 23 V1</h3><p>Domain-neutral engine, client workspace, transformation, pilot privacy, governance, quality gates and release hardening.</p></div></div><div class="panel-card"><h3>Canonical source hashes</h3><p><code>Page 0: 47a111bd…</code><br><code>Integrated LTL: 70850a00…</code></p></div><div class="panel-card"><h3>Open deployment gates</h3><ul><li>Live provider synthetic certification when LLM enabled</li><li>Exact deployed Vercel E2E</li><li>Dependency lockfile after registry access</li><li>Optional isolated restore/PITR certification before persistent confidential production data</li></ul></div>`)}
function openDrawer(eyebrow,title,html){$('#drawerEyebrow').textContent=eyebrow;$('#drawerTitle').textContent=title;$('#drawerBody').innerHTML=html;$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false')}
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true')}
init();
})();
</script>
